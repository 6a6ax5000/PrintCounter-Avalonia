name: Build Linux AppImage on: workflow_dispatch: push: branches: - main jobs: build: runs-on: ubuntu-latest steps: - name: Получить исходный код uses: actions/checkout@v4 - name: Установить .NET 8 uses: actions/setup-dotnet@v4 with: dotnet-version: "8.0.x" - name: Опубликовать Linux-приложение run: > dotnet publish PrintCounter.Avalonia.csproj --configuration Release --runtime linux-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true --output publish - name: Скачать appimagetool run: | wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage chmod +x appimagetool-x86_64.AppImage - name: Подготовить AppDir run: | mkdir -p AppDir/usr/bin cp publish/PrintCounter.Avalonia AppDir/usr/bin/PrintCounter chmod +x AppDir/usr/bin/PrintCounter cat > AppDir/PrintCounter.desktop <<'EOF' [Desktop Entry] Type=Application Name=PrintCounter Comment=Учёт напечатанных листов Exec=PrintCounter Categories=Office; Terminal=false EOF touch AppDir/printcounter.png - name: Создать AppImage run: | ./appimagetool-x86_64.AppImage \ --appimage-extract-and-run \ AppDir \ PrintCounter-x86_64.AppImage - name: Загрузить готовый AppImage uses: actions/upload-artifact@v4 with: name: PrintCounter-Linux-x86_64 path: PrintCounter-x86_64.AppImage if-no-files-found: error
