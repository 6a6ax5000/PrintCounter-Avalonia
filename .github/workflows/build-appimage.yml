name: Build Linux AppImage on: workflow_dispatch: push: branches: - main jobs: build: runs-on: ubuntu-latest steps: - name: Checkout uses: actions/checkout@v4 - name: Setup .NET uses: actions/setup-dotnet@v4 with: dotnet-version: "8.0.x" - name: Publish application run: dotnet publish PrintCounter.Avalonia.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish - name: Download appimagetool run: | wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage chmod +x appimagetool-x86_64.AppImage - name: Prepare AppDir run: | mkdir -p AppDir/usr/bin cp publish/PrintCounter.Avalonia AppDir/usr/bin/PrintCounter chmod +x AppDir/usr/bin/PrintCounter printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=PrintCounter' 'Exec=PrintCounter' 'Categories=Office;' 'Terminal=false' > AppDir/PrintCounter.desktop touch AppDir/printcounter.png - name: Create AppImage run: ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir PrintCounter-x86_64.AppImage env: ARCH: x86_64 - name: Upload AppImage uses: actions/upload-artifact@v4 with: name: PrintCounter-Linux-x86_64 path: PrintCounter-x86_64.AppImage if-no-files-found: error
